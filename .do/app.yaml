{
  "name": "zigma-clinic",
  "region": "fra",
  "services": [
    {
      "name": "web",
      "github": {
        "repo": "glpkv/zigma-by-copy",
        "branch": "main",
        "deploy_on_push": true
      },
      "dockerfile_path": "Dockerfile",
      "source_dir": "/",
      "http_port": 8080,
      "instance_count": 1,
      "instance_size_slug": "apps-s-1vcpu-0.5gb",
      "health_check": {
        "http_path": "/healthz"
      }
    }
  ],
  "domains": [
    {
      "domain": "zigma.gleblapkovsky.com",
      "type": "PRIMARY"
    }
  ],
  "ingress": {
    "rules": [
      {
        "match": {
          "path": {
            "prefix": "/"
          }
        },
        "component": {
          "name": "web"
        }
      }
    ]
  }
}
