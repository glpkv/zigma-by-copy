{
  "name": "zigma-clinic",
  "region": "fra",
  "domains": [
    {
      "domain": "zigma.gleblapkovsky.com",
      "type": "PRIMARY"
    }
  ],
  "ingress": {
    "rules": [
      {
        "match": {
          "path": {
            "prefix": "/"
          }
        },
        "component": {
          "name": "website"
        }
      }
    ]
  },
  "static_sites": [
    {
      "name": "website",
      "source_dir": "/public",
      "output_dir": ".",
      "index_document": "index.html",
      "git": {
        "repo_clone_url": "https://github.com/glpkv/zigma-by-copy.git",
        "branch": "main"
      }
    }
  ]
}
